name: Enviance
description: >-
  Enviance (now Cority Enviance) is an environmental, health, and safety (EHS)
  compliance-management SaaS platform. Originally an independent cloud
  environmental-compliance vendor, Enviance was acquired by Cority and its
  product now ships as "Cority Enviance." The platform manages regulatory
  requirements, compliance tasks, emissions and environmental events, chemicals
  and materials inventories, documents, workflows, and reporting for enterprises
  in regulated industries. Its EMS REST API (the "Cority Enviance App API")
  exposes 250+ operations across 39 service areas — Activity, Chemical, Material,
  Compliance, Requirement, Event, Task, Workflow, Document, Report, Portal, Bulk
  data, SCIM identity, and more — for building custom interfaces and integrating
  Enviance with corporate and third-party systems.
