l.ru\"\r\n          }\r\n        ]\r\n      },\r\n      {\r\n        \"name\": \"oleg FT 1 = num ddl linked 2\",\r\n        \"values\": [\r\n          \"100\",\r\n          \"100\"\r\n        ]\r\n      },\r\n      {\r\n        \"name\": \"oleg FT 1 = text multi\",\r\n        \"values\": [\r\n          \"val1\",\r\n          \"val3\"\r\n        ]\r\n      }\r\n    ]\r\n  },\r\n  \"onsuccess\",\r\n  \"onerror\"\r\n]\r\n```\r\nenvianceSdk.workflows.updateWorkflowCurrentStepExt\r\n```\r\n[\r\n  {\r\n    \"workflowIdOrUniqueId\": \"a4f13c99-5c2c-46dc-bbff-4aea388ef3ca\",\r\n    \"stepInfo\": {\r\n      \"comment\": \"my comment\",\r\n      \"transition\": {\r\n        \"stepActionName\": \"go to step 2\",\r\n        \"assignTo\": [\r\n          {\r\n            \"userIdOrName\": \"oleg\"\r\n          },\r\n          {\r\n            \"userIdOrName\": \"vitek\"\r\n          },\r\n          {\r\n            \"groupIdOrName\": \"Administrators\"\r\n          },\r\n          {\r\n            \"groupIdOrName\": \"BL Group\"\r\n          }\r\n        ]\r\n      },\r\n      \"fields\": [\r\n        {\r\n          \"name\": \"Date\",\r\n          \"values\": [\r\n            \"2013-02-01T00:00:00\"\r\n          ]\r\n        },\r\n        {\r\n          \"name\": \"CitationHyperlink\",\r\n          \"urlItems\": [\r\n            {\r\n              \"label\": \"may label\",\r\n              \"url\": \"http://test.com\"\r\n            }\r\n          ]\r\n        },\r\n        {\r\n          \"name\": \"NumberDDL linked\",\r\n          \"values\": [\r\n            \"1.23456E-05\",\r\n            \"1.23456E-05\"\r\n          ]\r\n        },\r\n        {\r\n          \"name\": \"Text(MSLB)\",\r\n          \"values\": [\r\n            \"test1\",\r\n            \"test2\"\r\n          ]\r\n        }\r\n      ]\r\n    },\r\n    \"clientRequestId\": \"19AA5290-15F2-451B-9EF3-4494F66FE59F\"\r\n  },\r\n  \"onsuccess\",\r\n  \"onerror\"\r\n]\r\n```\r\n\n"
