      description: "\n\nUpdates one or more values in the Form Fields of an existing Workflow Step. Any Form Fields *not* specified are left un-modified. A Step Action to invoke may also be specified, which will move (transition) the Workflow from the current Step to the destination Step of the Step Action.\r\n\r\n**Security:** Allowed for Users with Manage Workflows right or \"Report\" permission on the Workflow, or User in \"Workflow Managers\" role of WF, or User with \"Manage Workflows\" on any objects associated with the workflow.\r\n\r\n**SDK API:** `envianceSdk.workflows.updateWorkflowStep(workflowIdOrUniqueId, stepIdOrName, stepInfo, onsuccess, onerror)`\r\n\r\n```\r\n<div class=\"code\">\r\n<pre>\r\nPATCH /ver2/WorkflowService.svc/workflows/7ef9655e-916b-414f-8c88-5753fa731558 HTTP/1.1\r\nContent-Type: application/json; charset=UTF-8\r\n \r\n{\r\n  \"workflowInfo\": {\r\n    \"dueDate\": \"2012-09-19T18:00:00\",\r\n    \"name\": \"test\",\r\n    \"objects\": [\"/Generation - 1/NE TV\"],\r\n    \"documents\": [\"/Folder/Folder/Doc.txt\"]\r\n  }\r\n}\r\n\r\n```\r\n\n\n\nenvianceSdk.workflows.updateWorkflowStep\r\n```\r\n[\r\n  \"22cf40b5-b001-47ce-8853-020dc9e9aa8e\",\r\n  \"Oleg FT Step1\",\r\n  {\r\n    \"comment\": \"my comment\",\r\n    \"transition\": {\r\n      \"dueDate\": \"2013-02-15T00:00:00\",\r\n      \"stepActionName\": \"Oleg FT Step1 Action1\",\r\n      \"assignTo\": [\r\n        {\r\n          \"userIdOrName\": \"oleg\"\r\n        },\r\n        {\r\n          \"userIdOrName\": \"vitek\"\r\n        },\r\n        {\r\n          \"groupIdOrName\": \"Administrators\"\r\n        },\r\n        {\r\n          \"groupIdOrName\": \"BL Group\"\r\n        }\r\n      ]\r\n    },\r\n    \"fields\": [\r\n      {\r\n        \"name\": \"Oleg FT 1 = dt date\",\r\n        \"values\": [\r\n          \"2013-02-01T00:00:00\"\r\n        ]\r\n      },\r\n      {\r\n        \"name\": \"Oleg FT 1 = url\",\r\n        \"urlItems\": [\r\n          {\r\n            \"label\": \"may label\",\r\n            \"url\": \"http://mail.ru\"\r\n          }\r\n        ]\r\n      },\r\n      {\r\n        \"name\": \"oleg FT 1 = num ddl linked 2\",\r\n        \"values\": [\r\n          \"100\",\r\n          \"100\"\r\n        ]\r\n      },\r\n      {\r\n        \"name\": \"oleg FT 1 = text multi\",\r\n        \"values\": [\r\n          \"val1\",\r\n          \"val3\"\r\n        ]\r\n      }\r\n    ]\r\n  },\r\n  \"onsuccess\",\r\n  \"onerror\"\r\n]\r\n```\r\nenvianceSdk.workflows.updateWorkflowStepExt\r\n```\r\n[\r\n  {\r\n    \"workflowIdOrUniqueId\": \"22cf40b5-b001-47ce-8853-020dc9e9aa8e\",\r\n    \"stepIdOrName\": \"Oleg FT Step1\",\r\n    \"stepInfo\": {\r\n      \"comment\": \"my comment\",\r\n      \"transition\": {\r\n        \"dueDate\": \"2013-02-15T00:00:00\",\r\n        \"stepActionName\": \"Oleg FT Step1 Action1\",\r\n        \"assignTo\": [\r\n          {\r\n            \"userIdOrName\": \"oleg\"\r\n          },\r\n          {\r\n            \"userIdOrName\": \"vitek\"\r\n          },\r\n          {\r\n            \"groupIdOrName\": \"Administrators\"\r\n          },\r\n          {\r\n            \"groupIdOrName\": \"BL Group\"\r\n          }\r\n        ]\r\n      },\r\n      \"fields\": [\r\n        {\r\n          \"name\": \"Oleg FT 1 = dt date\",\r\n          \"values\": [\r\n            \"2013-02-01T00:00:00\"\r\n          ]\r\n        },\r\n        {\r\n          \"name\": \"Oleg FT 1 = url\",\r\n          \"urlItems\": [\r\n            {\r\n              \"label\": \"may label\",\r\n              \"url\": \"http://mail.ru\"\r\n            }\r\n          ]\r\n        },\r\n        {\r\n          \"name\": \"oleg FT 1 = num ddl linked 2\",\r\n          \"values\": [\r\n            \"100\",\r\n            \"100\"\r\n          ]\r\n        },\r\n        {\r\n          \"name\": \"oleg FT 1 = text multi\",\r\n          \"values\": [\r\n            \"val1\",\r\n            \"val3\"\r\n          ]\r\n        }\r\n      ]\r\n    },\