paths:
  /ver2/CommandService.svc/commands/{commandId}:
    get:
      tags:
      - Command
      description: 'Returns information about a previously submitted command (any API which is asynchronous).


        **Security:** All users.


        **SDK API (create):** `envianceSdk.commands.getCommand (commandId, onsuccess, onerror)`


        ```

        GET /ver2/CommandService.svc/commands/08fc5438-a0d8-4bf9-9141-12dd98e7ce80/ HTTP/1.1


        //RESPONSE

        {

        "id": "08fc5438-a0d8-4bf9-9141-12dd98e7ce80",

        "description": "Data batch processed.",

        "issued": "2012-12-01T08:00:00",

        "startedProcessing": "2012-12-01T08:01:00",

        "finishedProcessing": "2012-12-01T08:02:00",

        "status": "Succeeded",

        "objects": ["/Facility A/Unit X/Parameter Z"],

        "user": "JSmith",

        "errorInfo": {

        "error": "Requirement with Tag ''GZB_AVG_SORTED'' could not be found in the system.",

        "details": [

        { "key": "Tag", "value": "GZB_AVG_SORTED" },

        { "key": "Complete Date", "value": "2012-02-08T09:50:00" },

        { "key": "Value", "value": "18.00803565979" }

        ]

        }

        }


        ```


        envianceSdk.commands.getCommand

        ```

        [

        "eccd2310-9b5f-440b-bf0d-91f9803d036b",

        "onsuccess",

        "onerror"

        ]

        ```'
      operationId: Enviance.RestServices.Ver2.Async.Impl.CommandService.GetCommand
      parameters:
      - name: EnvApi-Systemid
        in: header
        description: Specify specific system to run instead of Home
        schema:
          type: string
      - name: EnvApi-Packageid
        in: header
        description: (optional) Clients application/package ID
        schema:
          type: string
      - name: EnvApi-Udf-DateTime-Iso-In-CustomFields
        in: header
        description: Udfs of DateTime should use Iso
        schema:
          type: string
          default: 'true'
      - name: EnvApi-Udf-DateTime-ReadInUserTz
        in: header
        description: (obsolete) Udfs of DateTime type whould be in ReadInUserTz
        schema:
          type: string
      - name: EnvApi-Udf-Value-Invariant
        in: header
        description: (optional) Udfs - Force Non-Localized (invariant) values
        schema:
          type: string
      - name: EnvApi-Localization-All
        in: header
        description: (optional) Extend objects with User-given Localizations
        schema:
          type: string
      - name: x-client-request-id
        in: header
        description: (optional) Client ID for double submit prevention
        schema:
          type: string
      - name: commandId
        in: path
        required: true
        schema:
          type: string
      responses:
        default:
          description: not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enviance.RestServices.Ver2.Async.CommandInfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/Enviance.RestServices.Ver2.Async.CommandInfo'
      summary: Enviance rest services ver2 async impl command service get command
      x-summary-source: derived
