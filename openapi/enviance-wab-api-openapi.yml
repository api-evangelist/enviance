        typeName:
          type: string
          uniqueItems: false
        stepName:
          type: string
          uniqueItems: false
        typeVersion:
          type: integer
          format: int32
          uniqueItems: false
        objectIDs:
          type: array
          items:
            type: string
          uniqueItems: false
      type: object
      format: LastFormConfigChanges
    Enviance.RestServices.Common.ModuleChangeTime:
      properties:
        module:
          type: string
          uniqueItems: false
        timestampUtc:
          type: string
          format: date-time
          uniqueItems: false
        timestampUtcList:
          type: array
          items:
            $ref: '#/components/schemas/Enviance.RestServices.Common.IdTimestamp'
          uniqueItems: false
      type: object
      format: Enviance.RestServices.Common.ModuleChangeTime
    Enviance.RestServices.Common.IdTimestamp:
