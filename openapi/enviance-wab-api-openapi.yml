        id:
          type: string
          format: guid
          uniqueItems: false
        timestampUtc:
          type: string
          format: date-time
          uniqueItems: false
      type: object
      format: Enviance.RestServices.Common.IdTimestamp
  securitySchemes:
    Basic:
      type: http
      scheme: basic
      description: Forces authentication with credentials via an api gateway
    EnvianceAuth:
      type: apiKey
      description: "**Enviance \\<SessionId\\>**. \n\t\t\t\t\t  Obtain SessionId by POST /ver2/AuthenticationService.svc/sessions first"
      name: Authorization
