      description: "\n\n\nenvianceSdk.eql.execute\r\n```\r\n[\r\n    \"select wi.name, wi.id from WorkflowType wi  where wi.name like '%lgm%'\",\r\n    1,\r\n    100,\r\n    \"onsuccess\",\r\n    \"onerror\"\r\n]\r\n```\r\nenvianceSdk.eql.executeExt\r\n```\r\n[\r\n  {\r\n    \"eql\": \"select TOP 1 wi.name, wi.id from WorkflowType wi\",\r\n    \"format\": \"xls\",\r\n    \"pageByColumn\": \"1,2\"\r\n  },\r\n  \"onsuccess\",\r\n  \"onerror\"\r\n]\r\n```\r\nenvianceSdk.eql.executeExtAsync\r\n```\r\n[\r\n  {\r\n    \"eql\": \"select TOP 1 wi.name, wi.id from WorkflowType wi\",\r\n    \"format\": \"xlsx\",\r\n    \"excelTemplateIdOrPath\": \"/shvets/Colusa Template.xlsm\",\r\n    \"excelSheetNames\": [\r\n      \"Raw Data\"\r\n    ],\r\n    \"excelHeaderCells\": [\r\n      {\r\n        \"row\": 1,\r\n        \"column\": 1,\r\n        \"value\": \"test\",\r\n        \"type\": \"s\",\r\n        \"style\": {\r\n          \"font\": {\r\n            \"bold\": true,\r\n            \"sz\": 11\r\n          }\r\n        }\r\n      }\r\n    ]\r\n  },\r\n  \"onsuccess\",\r\n  \"onerror\"\r\n]\r\n```\r\nenvianceSdk.packages.eql.ExecuteParametersInfo\r\n```\r\n[\r\n  \"path\",\r\n  \"json\",\r\n  1,\r\n  10\r\n]\r\n```\r\nenvianceSdk.packages.eql.executeEqlItem\r\n```\r\n[\r\n  {\r\n    \"path\": \"test.eql\",\r\n    \"format\": \"json\",\r\n    \"page\": 2,\r\n    \"pageSize\": 20\r\n  },\r\n  {\r\n    \"TimeZone\": 5,\r\n    \"Name\": \"X%\"\r\n  },\r\n  \"onsuccess\",\r\n  \"onerror\"\r\n]\r\n```\r\nenvianceSdk.packages.eql.executeEqlItemAsync\r\n```\r\n[\r\n  {\r\n    \"path\": \"test.eql\",\r\n    \"format\": \"xls\",\r\n    \"page\": 2,\r\n    \"pageSize\": 20,\r\n    \"filename\": \"my.xls\",\r\n    \"cachecontrol\": null,\r\n    \"excelTemplateIdOrPath\": \"/shvets/Colusa Template.xlsm\",\r\n    \"excelSheetNames\": [\r\n      \"Raw Data\"\r\n    ]\r\n  },\r\n  {\r\n    \"TimeZone\": 5,\r\n    \"Name\": \"X%\"\r\n  },\r\n  \"onsuccess\",\r\n  \"onerror\"\r\n]\r\n```\r\nenvianceSdk.packages.eql.executeEqlItemBinary\r\n```\r\n[\r\n  {\r\n    \"path\": \"test.eql\",\r\n    \"format\": \"json\",\r\n    \"page\": 2,\r\n    \"pageSize\": 20,\r\n    \"filename\": \"my.json\",\r\n    \"cachecontrol\": null\r\n  },\r\n  {\r\n    \"TimeZone\": 5,\r\n    \"Name\": \"X%\"\r\n  },\r\n  \"onsuccess\",\r\n  \"onerror\"\r\n]\r\n```\r\n\n"
