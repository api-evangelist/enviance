  /ver2/AuthenticationService.svc/sessions/cert:
    post:
      tags:
      - Authentication
      summary: Authentication By Cert
      description: 'Authenticate By Certificate


        Creates a new session by authenticating via encrypted username and certification id.


        **Security:** All users.


        **SDK API:** `envianceSdk.authentication.authenticateByCert(encryptedUserName, certUniqueId, onsuccess, onerror)`


        ```

        PATCH /ver2/AuthenticationService.svc/sessions HTTP/1.1

        Content-Type: application/json; charset=UTF-8


        {

        encryptedUserName: "username",

        certUniqueId: "abcd23456789",

        }


        ```'
      operationId: Enviance.RestServices.Ver2.Security.Impl.AuthenticationService.AuthenticateByCert
      parameters:
      - name: EnvApi-Systemid
        in: header
        description: Specify specific system to run instead of Home
        schema:
          type: string
      - name: EnvApi-Packageid
        in: header
