      description: "\n\nCreate a new user in Enviance system.\r\n\r\n** SDK API:**  envianceSdk.scim.createUser(user, onsuccess, onerror)\r\n\r\n** Example:**\r\nPOST /ScimIdentityService.svc/scim/v1/Users HTTP/1.1\r\nContent-Type: application/json; charset=UTF-8\r\nnull\n\n\nenvianceSdk.scim.createUser\r\n```\r\n[\r\n  {\r\n    \"schemas\": [\r\n      \"urn:scim:schemas:core:1.0\",\r\n      \"urn:scim:schemas:enviance:user\"\r\n    ],\r\n    \"userName\": \"scimupdatetest998990444\",\r\n    \"password\": \"1111\",\r\n    \"name\": {\r\n      \"givenName\": \"Updated\",\r\n      \"familyName\": \"Scim\"\r\n    },\r\n    \"emails\": [\r\n      {\r\n        \"type\": \"work\",\r\n        \"primary\": \"true\",\r\n        \"value\": \"scimuser1@enviance.com\"\r\n      }\r\n    ],\r\n    \"timezone\": \"America/New_York\",\r\n    \"preferredLanguage\": \"en_US\",\r\n    \"active\": true,\r\n    \"urn:scim:schemas:enviance:user\": {\r\n      \"properties\": [\r\n        {\r\n          \"propertyName\": \"supervisorusername\",\r\n          \"type\": \"supervisorusername\",\r\n          \"propertyValue\": \"someUsername\"\r\n        },\r\n        {\r\n          \"propertyName\": \"name2\",\r\n          \"propertyValue\": \"val2\",\r\n          \"type\": \"name2\",\r\n          \"isSensitiveData\": true\r\n        }\r\n      ],\r\n      \"emailDelivery\": \"HTML Email\",\r\n      \"receiveInformation\": true,\r\n      \"commandFailureNotification\": \"Inbox\",\r\n      \"companyName\": \"Enviance, Inc\",\r\n      \"mustChangePasswordAtNextLogin\": \"false\",\r\n      \"canNotChangePassword\": \"true\",\r\n      \"NotExpirePassword\": \"false\",\r\n      \"userRights\": [\r\n        {\r\n          \"name\": \"Manage Groups\",\r\n          \"granted\": true\r\n        }\r\n      ],\r\n      \"expires\": \"9999-12-31T00:00:00\",\r\n      \"comments\": \"This is a full Scim User\"\r\n    }\r\n  },\r\n  \"onsuccess\",\r\n  \"onerror\"\r\n]\r\n```\r\n\n"
      operationId: Enviance.RestServices.Ver2.Scim.Impl.ScimIdentityService.CreateUser
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: EnvApi-Systemid
        in: header
        description: Specify specific system to run instead of Home
        type: string
      - name: EnvApi-Packageid
