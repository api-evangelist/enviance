  /ver2/RequirementService.svc/requirements:
    post:
      tags:
      - Requirement
      description: "\n\n\nenvianceSdk.requirements.createRequirement\r\n```\r\n[\r\n  {\r\n    \"name\": \"Requirement Name\",\r\n    \"requirementType\": \"RequirementType\",\r\n    \"activeDate\": \"2010-02-22T00:00:00\",\r\n    \"requirementTemplateIdOrName\": \"Requirement Template 1\",\r\n    \"responsibleUserIdOrName\": \"BTaylor\",\r\n    \"parentIdOrPath\": \"Division For Mac TestFacility For Mac Test\",\r\n    \"frequencies\": [\r\n      {\r\n        \"beginDate\": \"2011-02-22T00:00:00\",\r\n        \"endDate\": \"2012-03-22T00:00:00\",\r\n        \"occurences\": 1\r\n      },\r\n      {\r\n        \"beginDate\": \"2014-02-22T00:00:00\",\r\n        \"endDate\": \"2014-03-22T00:00:00\",\r\n        \"occurences\": 2\r\n      }\r\n    ],\r\n    \"limitHistory\": [\r\n      {\r\n        \"beginDate\": \"2011-02-22T00:00:00\",\r\n        \"endDate\": \"2012-03-22T00:00:00\",\r\n        \"comparisonOperation\": \"\\u003E LOW\",\r\n        \"regLowLimit\": 1,\r\n        \"regHighLimit\": 4\r\n      }\r\n    ],\r\n    \"regulatoryLimit\": {\r\n      \"templateIdOrName\": \"task-template-m-1\",\r\n      \"assignor\": \"jstestsAccessUser\",\r\n      \"assignees\": [\r\n        {\r\n          \"userIdOrName\": \"JSmith\"\r\n        },\r\n        {\r\n          \"groupIdOrName\": \"Administrators\"\r\n        }\r\n      ]\r\n    },\r\n    \"notifyRecipients\": {\r\n      \"recipients\": [\r\n        {\r\n          \"userIdOrName\": \"JSmith\"\r\n        },\r\n        {\r\n          \"groupIdOrName\": \"Administrators\"\r\n        }\r\n      ],\r\n      \"inbox\": true\r\n    }\r\n  },\r\n  \"onsuccess\",\r\n  \"onerror\"\r\n]\r\n```\r\n\n"
      operationId: Enviance.RestServices.Ver2.Requirements.Impl.RequirementService.CreateRequirement
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: EnvApi-Systemid
        in: header
        description: Specify specific system to run instead of Home
        type: string
      - name: EnvApi-Packageid
        in: header
        description: (optional) Clients application/package ID
        type: string
      - name: EnvApi-Udf-DateTime-Iso-In-CustomFields
        in: header
        description: Udfs of DateTime should use Iso
        type: string
        default: 'true'
      - name: EnvApi-Udf-DateTime-ReadInUserTz
        in: header
        description: (obsolete) Udfs of DateTime type whould be in ReadInUserTz
        type: string
      - name: EnvApi-Udf-Value-Invariant
        in: header
        description: (optional) Udfs - Force Non-Localized (invariant) values
        type: string
      - name: EnvApi-Localization-All
        in: header
        description: (optional) Extend objects with User-given Localizations
        type: string
      - name: x-client-request-id
        in: header
        description: (optional) Client ID for double submit prevention
        type: string
      - name: CreateRequirementWrapper
        in: body
        required: true
        schema:
          $ref: '#/definitions/CreateRequirement'
      responses:
        default:
          description: not available
          schema:
            type: string
            format: guid
