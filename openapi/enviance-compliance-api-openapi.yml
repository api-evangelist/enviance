  /ver2/ComplianceService.svc/locations:
    post:
      tags:
      - Compliance
      description: "\n\nCreates a new Location object in the Compliance Model, optionally by copying the structure from another Location to the new Location. Supported object types are Division, Facility (Program), Unit (Element), and Point of Interest. This API does not support historical custom fields (those with Track Value History enabled).\r\n\r\n**Security:** User with permission to Compliance Objects.\r\n\r\n**SDK API (create):**  `envianceSdk.compliance.createLocation (locationInfo, onsuccess, onerror)`\r\n\r\n**SDK API (create async):**  `envianceSdk.compliance.createLocationAsync (locationInfo, onsuccess, onerror)` \r\n\r\n**SDK API (copy):**  `envianceSdk.compliance.copyLocation(locationInfo, copyFrom, onsuccess, onerror)`\r\n\r\n**SDK API (copy async):**  `envianceSdk.compliance.copyLocationAsync (locationInfo, copyFrom, onsuccess, onerror)`\r\n\r\n```\r\n//EXAMPLE (CREATE)\r\n\r\nPOST /ver2/ComplianceService.svc/locations HTTP 1.1\r\nContent-Type: application/json; charset=utf-8\r\n\r\n{\r\n  \"locationInfo\": {\r\n    \"name\": \"Toy Manufacturing\",\r\n    \"type\": \"Facility\",\r\n    \"parentPath\": \"/Manufacturing Division/Toys/\",\r\n    \"timeZone\": { \"name\": \"Pacific Time (US & Canada) (UTC-08:00) (With DST)\" },\r\n    \"activeDate\": \"2012-01-01T00:00:00\",\r\n    \"fieldTemplate\": \"Manufacturing Facility\",\r\n    \"fieldValues\": [\r\n      {\"name\": \"Aspect\",\r\n      \"values\": [\"Air pollution control waste\"]},\r\n      {\"name\": \"Start Date\",\r\n      \"values\": [\"2012-09-19T20:00:00\"]},\r\n      {\"name\": \"Type\",\r\n      \"values\": [\"Spill\", \"Near Miss\"]},\r\n      {\"name\": \"Category\",\r\n      \"values\": [\"Cat1\", \"Cat1.1\", \"Cat1.1.1\"]}\r\n    ],\r\n  \"documents\": [\"/Folder A/Document.doc\"]\r\n  }\r\n}\r\n\r\n//EXAMPLE (COPY)\r\nPOST /ver2/ComplianceService.svc/locations HTTP 1.1\r\nContent-Type: application/json; charset=utf-8\r\n \r\n{\r\n  \"locationInfo\": {\r\n  \"name\": \"Toy Manufacturing\",\r\n  \"type\": \"Facility\",\r\n  \"parentPath\": \"/Manufacturing Division/Toys/\",\r\n  \"timeZone\": { \"name\": \"Pacific Time (US & Canada) (UTC-08:00) (With DST)\" },\r\n  \"activeDate\": \"2012-01-01T00:00:00\",\r\n  \"fieldTemplate\": \"Manufacturing Facility\",\r\n  \"fieldValues\": [\r\n    {\"name\": \"Aspect\",\r\n    \"values\": [\"Air pollution control waste\"]},\r\n    {\"name\": \"Start Date\",\r\n    \"values\": [\"2012-09-19T20:00:00\"]},\r\n    {\"name\": \"Type\",\r\n    \"values\": [\"Spill\", \"Near Miss\"]},\r\n    {\"name\": \"Category\",\r\n    \"values\": [\"Cat1\", \"Cat1.1\", \"Cat1.1.1\"]}\r\n  ],\r\n  \"documents\": [\"/Folder A/Document.doc\"]\r\n  },\r\n  \"copyFrom\": \"/Manufacturing Division/Books\"\r\n}\r\n\r\n```\r\n\n\n\nenvianceSdk.compliance.createLocation\r\n```\r\n[\r\n  {\r\n    \"name\": \"Toy Manufacturing\",\r\n    \"type\": \"Facility\",\r\n    \"isSensitiveData\": true,\r\n    \"parentPath\": \"/Manufacturing Division/Toys/\",\r\n    \"timeZone\": {\r\n      \"name\": \"USA Pacific\"\r\n    },\r\n    \"fieldTemplate\": \"Manufacturing Facility\",\r\n    \"CorityCachedID\": 0,\r\n    \"CorityLink\": false,\r\n    \"fieldValues\": [\r\n      {\r\n        \"name\": \"Aspect\",\r\n        \"values\": [\r\n          \"Air pollution control waste\"\r\n        ]\r\n      },\r\n      {\r\n        \"name\": \"Start Date\",\r\n        \"values\": [\r\n          \"2012-09-19T20:00\"\r\n        ]\r\n      },\r\n      {\r\n        \"name\": \"Type\",\r\n        \"values\": [\r\n          \"Spill\",\r\n          \"Near Miss\"\r\n        ]\r\n      },\r\n      {\r\n        \"name\": \"Category\",\r\n        \"values\": [\r\n          \"Cat1\",\r\n          \"Cat1.1\",\r\n          \"Cat1.1.1\"\r\n        ]\r\n      }\r\n    ],\r\n    \"namelocalized\": [\r\n      {\r\n        \"value\": \"DemoLoc POI (US)\",\r\n        \"culture\": \"en-us\"\r\n      }\r\n    ],\r\n    \"documents\": [\r\n      \"/Folder A/Document.doc\"\r\n    ]\r\n  },\r\n  \"onsuccess\",\r\n  \"onerror\"\r\n]\r\n```\r\n\n"
